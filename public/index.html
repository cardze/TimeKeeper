<!DOCTYPE html>
<!-- 
  This is the main HTML file for the TimeKeeper application.
  It serves as the entry point for our React application.
-->
<html lang="en">
  <head>
    <!-- Character encoding for the document -->
    <meta charset="utf-8" />
    
    <!-- Viewport meta tag for responsive design on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#000000" />
    
    <!-- Description of the application for search engines -->
    <meta
      name="description"
      content="TimeKeeper - A time management application to track your daily activities"
    />
    
    <!-- Title that appears in the browser tab -->
    <title>TimeKeeper - Manage Your Time</title>
  </head>
  <body>
    <!-- 
      Fallback message for browsers with JavaScript disabled
      This ensures users know they need JavaScript to run the app
    -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- 
      Root div element where our React application will be mounted
      The id "root" is referenced in index.js to render the React app
    -->
    <div id="root"></div>
    
    <!--
      This HTML file is a template.
      The JavaScript bundle created by webpack will be automatically injected here
      when the application builds.
    -->
  </body>
</html>
